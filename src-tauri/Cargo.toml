[package]
name = "oiagent-coworker"
version = "0.0.1"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["api-all"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
ring = "0.17"
reqwest = { version = "0.12", features = ["json"] }

[build-dependencies]
tauri-build = { version = "1.5", features = [] }