[project]
name = "oiagent-coworker"
version = "0.0.1"
description = "OIagent Desktop Companion, derived from OpenWorker (MIT)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "mcp>=1.1,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "anyio>=4.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[project.scripts]
oiagent-coworker = "oiagent_coworker.cli:main"
oiagent-coworker-server = "oiagent_coworker.server.run:main"

[project.urls]
Homepage = "https://github.com/OIagent/oiagent-coworker"
Repository = "https://github.com/OIagent/oiagent-coworker"